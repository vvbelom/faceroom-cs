name: Публикация страницы

# Страница собирается из двух частей:
#   * site/ на ветке main — сама страница (этот репозиторий);
#   * data.enc.json на ветке data — зашифрованные данные. Их каждое утро кладёт
#     воркфлоу приватного репозитория с ботами и присылает сигнал data-updated.
#
# Данные лежат в отдельной ветке одним коммитом (её перезаписывают), чтобы
# ежедневные файлы не копились в истории публичного репозитория.
#
# Выкладка идёт только с main: окружение github-pages разрешает деплой с неё.
# repository_dispatch и schedule всегда запускаются на основной ветке.
#
# Второй канал публикации — та же самая site/ (уже со свежими данными) ещё и
# по FTP на домен компании, https://face-room.ru/cs/. Там Bitrix: директория
# резолвится в index.php, а не index.html (index.html отдаёт 404), поэтому
# перед выгрузкой копируем index.html в index.php — страница статическая,
# расширение .php ей не мешает, сервер просто отдаёт файл как есть.
#
# На этом хостинге app.js/style.css залипают в прокси-кеше и не обновляются
# даже после настоящих изменений файла (проверено — ETag не меняется между
# выгрузками). data.enc.json так не делает, его не трогаем. Лечим только
# app.js/style.css: при каждой выгрузке переименовываем их по хешу содержимого
# (не коммита — чтобы имя менялось только когда меняется сам файл) и
# переписываем ссылки в index.php — такого имени в кеше ещё не было, значит
# и подменить нечего. Старые хешированные файлы на сервере удаляем, чтобы не
# копились.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [data-updated]
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 * * *"      # 11:00 МСК — подстраховка, если сигнал не дошёл

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Взять данные из ветки data
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git show origin/data:data.enc.json > site/data.enc.json
            echo "данные: $(wc -c < site/data.enc.json) байт"
          else
            echo "::warning::Ветки data пока нет — страница выйдет без данных"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Продублировать index.html как index.php (для Bitrix)
        run: cp site/index.html site/index.php

      # SamKirkland/FTP-Deploy-Action (basic-ftp внутри) на этом хосте падает
      # с ECONNRESET: пытается EPSV/passive-IPv6, а у хоста только IPv4-адрес
      # (проверено — AAAA-записи нет), сам экшен способа отключить EPSV не
      # даёт. curl с --disable-epsv работает надёжно — обычный PASV по IPv4.
      - name: Выгрузить на face-room.ru/cs/ (FTP)
        run: |
          cd site

          # Переименовываем app.js/style.css по хешу содержимого — см. комментарий
          # в начале файла про залипающий прокси-кеш. Хеш содержимого (не коммита),
          # чтобы файл менял имя только когда меняется он сам, а не любой коммит.
          HASH_JS=$(sha256sum app.js | cut -c1-10)
          HASH_CSS=$(sha256sum style.css | cut -c1-10)
          mv app.js "app.$HASH_JS.js"
          mv style.css "style.$HASH_CSS.css"
          sed -i "s/app\.js/app.$HASH_JS.js/; s/style\.css/style.$HASH_CSS.css/" index.php
          echo "app.js → app.$HASH_JS.js, style.css → style.$HASH_CSS.css"

          echo "---- удаляем на сервере старые app.*.js/style.*.css (кроме текущих) ----"
          OLD_ASSETS=$(curl --silent --show-error --ftp-pasv --disable-epsv -u "fac2790745_cs:${{ secrets.FTP_PASSWORD }}" \
            --list-only "ftp://ftp.fac2790745.nichost.ru/" | grep -E '^(app|style)\.[0-9a-f]+\.(js|css)$' || true)
          for old in $OLD_ASSETS; do
            if [ "$old" != "app.$HASH_JS.js" ] && [ "$old" != "style.$HASH_CSS.css" ]; then
              echo "✗ удаляю старый $old"
              curl --silent --show-error --ftp-pasv --disable-epsv -u "fac2790745_cs:${{ secrets.FTP_PASSWORD }}" \
                -Q "DELE $old" "ftp://ftp.fac2790745.nichost.ru/"
            fi
          done

          for f in *; do
            echo "→ $f"
            curl --silent --show-error --ftp-pasv --disable-epsv --connect-timeout 20 --retry 3 \
              -u "fac2790745_cs:${{ secrets.FTP_PASSWORD }}" -T "$f" "ftp://ftp.fac2790745.nichost.ru/$f"
          done
          echo "---- содержимое директории на сервере после выгрузки ----"
          curl --silent --show-error --ftp-pasv --disable-epsv -u "fac2790745_cs:${{ secrets.FTP_PASSWORD }}" \
            --list-only "ftp://ftp.fac2790745.nichost.ru/"
          echo "---- проверка: читаем файлы обратно по FTP и сверяем с тем, что выгружали (мимо HTTP-кеша) ----"
          mkdir -p /tmp/ftp-check
          for f in *; do
            curl --silent --show-error --ftp-pasv --disable-epsv -u "fac2790745_cs:${{ secrets.FTP_PASSWORD }}" \
              "ftp://ftp.fac2790745.nichost.ru/$f" -o "/tmp/ftp-check/$f"
            if cmp -s "$f" "/tmp/ftp-check/$f"; then echo "✅ $f — совпадает"; else echo "❌ $f — ОТЛИЧАЕТСЯ от выгруженного"; fi
          done
